name: Refresh PSX data

# Re-scrapes the exchange on GitHub's machines and republishes the dashboard to
# GitHub Pages, so the hosted view is current with your PC switched off.
#
# The hosted dashboard's Refresh / Add / Remove buttons trigger this same
# workflow through the GitHub API, which is how a static page gets a backend.
on:
  schedule:
    # PSX trades 09:15-15:30 PKT = 04:15-10:30 UTC. Refresh through the session
    # and once after the close, so the hosted dashboard is current on its own and
    # you rarely need to ask for anything. Actions minutes are free and unlimited
    # on public repositories. GitHub queues cron jobs, so runs may start late.
    - cron: "0 5,7,9,11 * * 1-5"     # during the session
    - cron: "30 12 * * 1-5"          # 17:30 PKT, after the close
  workflow_dispatch:
    inputs:
      add:
        description: "Symbols to add (comma separated, e.g. LUCK,SYS)"
        type: string
        default: ""
      remove:
        description: "Symbols to remove"
        type: string
        default: ""
      ratios:
        description: "Re-fetch balance-sheet ratios for every holding (slow)"
        type: boolean
        default: false

permissions:
  contents: write           # needed to commit the refreshed dashboard

concurrency:
  group: psx-refresh        # never let two refreshes run at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip install step: this project uses only the standard library.

      # Inputs are untrusted, so they go in through the environment rather than
      # being interpolated into the shell, and are validated in Python.
      - name: Update the watchlist
        id: watchlist
        if: inputs.add != '' || inputs.remove != ''
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
        run: python manage_watchlist.py --add "$ADD" --remove "$REMOVE"

      # Covers the whole KSE-100 plus anything anyone has asked for, so every
      # visitor can add those instantly without waiting for a collection run.
      - name: Scrape PSX
        run: python psx_scraper.py

      # Balance-sheet ratios need a real browser to render the source page.
      # ubuntu-latest ships Chrome, so there is still nothing to install.
      - name: Fetch ratios for newly added symbols
        if: steps.watchlist.outputs.new_symbols != ''
        env:
          NEW: ${{ steps.watchlist.outputs.new_symbols }}
        run: python psx_ratios.py $NEW
        continue-on-error: true

      - name: Fetch ratios for every holding
        if: inputs.ratios
        run: python psx_ratios.py --overwrite
        continue-on-error: true    # a slow render must not fail the whole run

      - name: Fold ratios into the data file
        if: inputs.ratios || steps.watchlist.outputs.new_symbols != ''
        run: python psx_scraper.py

      - name: Build docs/
        run: python build_docs.py

      - name: Commit the refreshed dashboard
        run: |
          git config user.name  "psx-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/psx_data.json data/psx_data.js data/manual.json watchlist.json
          if git diff --staged --quiet; then
            echo "No changes - nothing to publish."
            exit 0
          fi
          git commit -m "Refresh PSX data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Anything else pushing meanwhile (a control run, or a commit from a
          # laptop) would otherwise reject this push and lose the work. These
          # files are regenerated artefacts, so on a conflict ours wins: during
          # a rebase, "theirs" refers to the commit being replayed.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published."
              exit 0
            fi
            echo "Push rejected - someone pushed first. Rebasing and retrying ($attempt/3)."
            git pull --rebase -X theirs origin main || exit 1
          done
          echo "Could not publish after 3 attempts."
          exit 1

      - name: Summary
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("data/psx_data.json", encoding="utf-8"))
          stocks = d.get("stocks", {})
          print("### PSX refresh finished\n")
          print("- Holdings tracked: **%d**" % len(stocks))
          print("- With balance-sheet data: **%d**" % len(d.get("manual", {})))
          print("- Data timestamp: %s" % d.get("generatedAt"))
          errs = d.get("errors") or {}
          if errs:
              print("- Failed: %s" % ", ".join(errs))
          print("\n| Symbol | Price | P/E | Div yld |")
          print("|---|---|---|---|")
          for s, r in sorted(stocks.items()):
              v = r.get("valuation") or {}
              fmt = lambda x, suf="": ("%.2f%s" % (x, suf)) if isinstance(x, (int, float)) else "-"
              print("| %s | %s | %s | %s |" % (s, fmt(v.get("price")), fmt(v.get("pe")),
                                               fmt(v.get("divYield"), "%")))
          PY
